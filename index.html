<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Lab</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #cbd5e1;
    }

    .search-box {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    #search {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 10px 15px 40px;
    }

    #prompts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
    }

    .content h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .prompt {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
      max-height: 150px;
      overflow: auto;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>✨ Prompt Lab</h1>
  <p>Discover amazing AI prompts</p>
</header>

<div class="search-box">
  <input
    type="text"
    id="search"
    placeholder="🔍 Search prompts..."
  >
</div>

<div class="container">
  <div id="prompts">
    <div class="empty">Loading prompts...</div>
  </div>
</div>

<footer>
  © 2026 Prompt Lab
</footer>

<script>

  // ==============================
  // SUPABASE SETTINGS
  // ==============================

  const SUPABASE_URL = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

  const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==============================
  // LOAD PROMPTS
  // ==============================

  let allPrompts = [];

  async function loadPrompts() {

    const { data, error } = await db
      .from("prompts")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.log(error);

      document.getElementById("prompts").innerHTML =
        '<div class="empty">Unable to load prompts.</div>';

      return;
    }

    allPrompts = data || [];

    displayPrompts(allPrompts);
  }


  // ==============================
  // DISPLAY PROMPTS
  // ==============================

  function displayPrompts(prompts) {

    const container = document.getElementById("prompts");

    if (prompts.length === 0) {

      container.innerHTML =
        '<div class="empty">No prompts found 😔</div>';

      return;
    }

    container.innerHTML = prompts.map(item => `

      <div class="card">

        ${
          item.image_url
          ? `<img src="${item.image_url}" alt="${item.title}">`
          : ""
        }

        <div class="content">

          <h2>${escapeHTML(item.title)}</h2>

          ${
            item.category
            ? `<span class="category">${escapeHTML(item.category)}</span>`
            : ""
          }

          <div class="prompt">
            ${escapeHTML(item.prompt)}
          </div>

          <button onclick="copyPrompt(${item.id})">
            📋 Copy Prompt
          </button>

        </div>

      </div>

    `).join("");
  }


  // ==============================
  // SEARCH
  // ==============================

  document.getElementById("search").addEventListener("input", function () {

    const query = this.value.toLowerCase().trim();

    const filtered = allPrompts.filter(item =>

      (item.title || "").toLowerCase().includes(query) ||

      (item.prompt || "").toLowerCase().includes(query) ||

      (item.category || "").toLowerCase().includes(query)

    );

    displayPrompts(filtered);

  });


  // ==============================
  // COPY PROMPT
  // ==============================

  async function copyPrompt(id) {

    const item = allPrompts.find(p => p.id === id);

    if (!item) return;

    try {

      await navigator.clipboard.writeText(item.prompt);

      alert("✅ Prompt copied!");

    } catch (error) {

      alert("❌ Copy failed");

    }
  }


  // ==============================
  // SECURITY: ESCAPE HTML
  // ==============================

  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
  }


  // START
  loadPrompts();

</script>

</body>
</html>
